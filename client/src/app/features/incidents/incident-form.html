<app-modal [title]="incident ? 'Edit Incident' : 'Report Incident'" [isOpen]="isOpen" (closed)="onCancel()">
  <div class="form-group">
    <label class="form-label">Title</label>
    <input class="form-control" type="text" [(ngModel)]="formData.title" placeholder="Incident title" />
  </div>
  <div class="form-group">
    <label class="form-label">Description</label>
    <textarea class="form-control" [(ngModel)]="formData.description" placeholder="Describe the incident" rows="3"></textarea>
  </div>
  <div class="form-group">
    <label class="form-label">Site</label>
    <select class="form-control" [(ngModel)]="formData.siteId">
      <option [value]="0">Select site</option>
      @for (site of sites; track site.siteId) {
        <option [value]="site.siteId">{{ site.siteName }}</option>
      }
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Reported By</label>
    <select class="form-control" [(ngModel)]="formData.reportedById">
      <option [value]="0">Select personnel</option>
      @for (person of personnel; track person.personnelId) {
        <option [value]="person.personnelId">{{ person.fullName }}</option>
      }
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Severity</label>
    <select class="form-control" [(ngModel)]="formData.severity">
      <option value="Low">Low</option>
      <option value="Medium">Medium</option>
      <option value="High">High</option>
      <option value="Critical">Critical</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Status</label>
    <select class="form-control" [(ngModel)]="formData.status">
      <option value="Open">Open</option>
      <option value="UnderReview">Under Review</option>
      <option value="Resolved">Resolved</option>
      <option value="Closed">Closed</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Occurred Date</label>
    <input class="form-control" type="datetime-local" [(ngModel)]="formData.occurredDate" />
  </div>
  <div class="form-actions">
    <button class="btn btn-secondary" (click)="onCancel()">Cancel</button>
    <button class="btn btn-primary" (click)="onSubmit()" [disabled]="saving">
      {{ saving ? 'Saving...' : (incident ? 'Update Incident' : 'Report Incident') }}
    </button>
  </div>
</app-modal>
