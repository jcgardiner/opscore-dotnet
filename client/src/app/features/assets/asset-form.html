<app-modal [title]="asset ? 'Edit Asset' : 'Add Asset'" [isOpen]="isOpen" (closed)="onCancel()">
  <div class="form-group">
    <label class="form-label">Asset Name</label>
    <input class="form-control" type="text" [(ngModel)]="formData.assetName" placeholder="Enter asset name" />
  </div>
  <div class="form-group">
    <label class="form-label">Asset Type</label>
    <select class="form-control" [(ngModel)]="formData.assetType">
      <option value="">Select type</option>
      <option value="Equipment">Equipment</option>
      <option value="Vehicle">Vehicle</option>
      <option value="Facility">Facility</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Serial Number</label>
    <input class="form-control" type="text" [(ngModel)]="formData.serialNumber" placeholder="Serial number" />
  </div>
  <div class="form-group">
    <label class="form-label">Site</label>
    <select class="form-control" [(ngModel)]="formData.siteId">
      <option [value]="0">Select site</option>
      @for (site of sites; track site.siteId) {
        <option [value]="site.siteId">{{ site.siteName }}</option>
      }
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Assigned Personnel (optional)</label>
    <select class="form-control" [(ngModel)]="formData.assignedPersonnelId">
      <option [value]="null">None</option>
      @for (person of personnel; track person.personnelId) {
        <option [value]="person.personnelId">{{ person.fullName }}</option>
      }
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Status</label>
    <select class="form-control" [(ngModel)]="formData.status">
      <option value="Operational">Operational</option>
      <option value="Maintenance">Maintenance</option>
      <option value="Decommissioned">Decommissioned</option>
    </select>
  </div>
  <div class="form-actions">
    <button class="btn btn-secondary" (click)="onCancel()">Cancel</button>
    <button class="btn btn-primary" (click)="onSubmit()" [disabled]="saving">
      {{ saving ? 'Saving...' : (asset ? 'Update Asset' : 'Add Asset') }}
    </button>
  </div>
</app-modal>
