<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h1 class="login-title">OpsCore</h1>
      <p class="login-subtitle">Field Operations & Compliance</p>
    </div>

    @if (error) {
      <div class="error-banner">{{ error }}</div>
    }

    <div class="form-body">
      @if (mode === 'register') {
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input class="form-control" type="text" [(ngModel)]="firstName" placeholder="First name" />
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input class="form-control" type="text" [(ngModel)]="lastName" placeholder="Last name" />
          </div>
        </div>
      }
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" [(ngModel)]="email" placeholder="email@example.com" />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" [(ngModel)]="password" placeholder="Password" />
      </div>
      @if (mode === 'register') {
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input class="form-control" type="password" [(ngModel)]="confirmPassword" placeholder="Confirm password" />
        </div>
      }
      <button class="btn btn-primary btn-full" (click)="onSubmit()" [disabled]="loading">
        {{ loading ? 'Please wait...' : (mode === 'login' ? 'Sign In' : 'Create Account') }}
      </button>
    </div>

    <div class="login-footer">
      @if (mode === 'login') {
        <p>Don't have an account? <a (click)="toggleMode()">Register</a></p>
      } @else {
        <p>Already have an account? <a (click)="toggleMode()">Sign In</a></p>
      }
    </div>
  </div>
</div>
